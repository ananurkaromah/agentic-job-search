command: ["python", "app.py"]

env:
  - name: "LAKEBASE_SECRET_SCOPE"
    value: "job_copilot"
  - name: "LAKEBASE_SECRET_KEY"
    value: "lakebase-url"
  # Set each to a real Databricks Job ID once you've created that job
  # (Workflows -> Create Job). Leave blank/unset to hide it from the
  # dashboard until then.
  - name: "FETCH_LIVE_JOBS_JOB_ID"
    value: ""
  - name: "ETL_PIPELINE_JOB_ID"
    value: ""
  - name: "SYNC_DOCUMENTS_JOB_ID"
    value: ""
  - name: "INGEST_EMBEDDINGS_JOB_ID"
    value: ""
