<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Copilot — Sync Dashboard</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
        h1 { font-size: 1.4rem; }
        h2 { font-size: 1.1rem; margin-top: 2rem; }
        button { padding: 6px 14px; margin-right: 8px; cursor: pointer; }
        .sync-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
        .status { font-size: 0.85rem; color: #555; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
        th { background: #f5f5f5; }
        select { padding: 4px; }
    </style>
</head>
<body>
    <h1>🧭 Job Copilot — Sync Dashboard</h1>

    <h2>Trigger a sync</h2>
    {% if syncs %}
        {% for name in syncs %}
        <div class="sync-row">
            <strong>{{ name }}</strong>
            <button onclick="runSync('{{ name }}')">Run</button>
            <span class="status" id="status-{{ name }}"></span>
        </div>
        {% endfor %}
    {% else %}
        <p>No sync jobs configured. Set the *_JOB_ID env vars in app.yaml once you've created the Databricks Jobs.</p>
    {% endif %}

    <h2>Synced records</h2>
    <select id="table-select" onchange="loadRecords()">
        {% for t in tables %}
        <option value="{{ t }}">{{ t }}</option>
        {% endfor %}
    </select>
    <button onclick="loadRecords()">Refresh</button>
    <div id="records"></div>

<script>
async function runSync(name) {
    const statusEl = document.getElementById('status-' + name);
    statusEl.textContent = 'starting...';
    const res = await fetch(`/app/syncs/${name}/run`, { method: 'POST' });
    const data = await res.json();
    if (data.error) { statusEl.textContent = 'error: ' + data.error; return; }
    statusEl.textContent = 'run ' + data.run_id + ' — polling...';
    pollRun(name, data.run_id, statusEl);
}

async function pollRun(name, runId, statusEl) {
    const res = await fetch(`/app/syncs/${name}/runs/${runId}`);
    const data = await res.json();
    statusEl.textContent = `run ${runId}: ${data.life_cycle_state || 'unknown'} ${data.result_state || ''}`;
    if (data.life_cycle_state && !['TERMINATED', 'SKIPPED', 'INTERNAL_ERROR'].includes(data.life_cycle_state.replace(/[^A-Z_]/g, ''))) {
        setTimeout(() => pollRun(name, runId, statusEl), 4000);
    }
}

async function loadRecords() {
    const table = document.getElementById('table-select').value;
    const res = await fetch(`/app/records/${table}?limit=25`);
    const data = await res.json();
    const container = document.getElementById('records');
    if (!data.rows || data.rows.length === 0) {
        container.innerHTML = '<p>No rows.</p>';
        return;
    }
    const cols = Object.keys(data.rows[0]);
    let html = '<table><thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
    for (const row of data.rows) {
        html += '<tr>' + cols.map(c => `<td>${row[c] ?? ''}</td>`).join('') + '</tr>';
    }
    html += '</tbody></table>';
    container.innerHTML = html;
}

if (document.getElementById('table-select')) { loadRecords(); }
</script>
</body>
</html>
